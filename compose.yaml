services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: http://localhost:8080
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      - keycloak-data:/opt/keycloak/data
  backend:
    build: ./backend
    environment:
      ISSUER: http://localhost:8080/realms/classroom
      JWKS_URL: http://keycloak:8080/realms/classroom/protocol/openid-connect/certs
      AUDIENCE: identity-api
    ports:
      - "127.0.0.1:8000:8000"
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports:
      - "127.0.0.1:5173:80"
volumes:
  keycloak-data:
